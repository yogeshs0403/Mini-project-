{% extends "base.html" %}{% block title %}Login | CyberAware{% endblock %}{% block content %}
<div class="auth-wrap"><form class="panel auth" method="post"><div class="eyebrow">WELCOME BACK</div><h2>Login to your account</h2><p class="muted">Continue learning how to stay safe online.</p>
<label>Username<input name="username" required minlength="3" autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label>
<button class="btn primary full">Login →</button><p class="muted center">New here? <a href="{{ url_for('register') }}">Create an account</a></p></form></div>{% endblock %}
