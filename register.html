{% extends "base.html" %}{% block title %}Register | CyberAware{% endblock %}{% block content %}
<div class="auth-wrap"><form class="panel auth" method="post"><div class="eyebrow">JOIN CYBERAWARE</div><h2>Create your account</h2><p class="muted">Start building safer digital habits.</p>
<label>Username<input name="username" required minlength="3" autocomplete="username"></label><label>Password<input type="password" name="password" required minlength="8" autocomplete="new-password"><small>Use at least 8 characters for this demo.</small></label>
<button class="btn primary full">Create account →</button><p class="muted center">Already registered? <a href="{{ url_for('login') }}">Login</a></p></form></div>{% endblock %}
